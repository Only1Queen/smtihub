# SMTI HUB — internal deployment. See DEPLOYMENT.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_OWNER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy:/deploy:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    # Not published to the host: only the web service needs to reach it.

  # One-shot deploy chain: roles -> migrate -> grants+verify -> web.
  # `docker compose up -d --build` runs all of it in order; web does not start
  # unless every step exited 0. See DEPLOYMENT.md.
  roles:
    image: postgres:16-alpine
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD}
    volumes:
      - ./deploy:/deploy:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - psql -h db -U "$$POSTGRES_OWNER" -d "$$POSTGRES_DB"
        -v web_password="'$$POSTGRES_WEB_PASSWORD'" -f /deploy/bootstrap_roles.sql

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_OWNER}:${POSTGRES_OWNER_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      roles:
        condition: service_completed_successfully
    command: ["python", "manage.py", "migrate"]

  # Re-granted after every migrate: a new table arrives unprotected otherwise.
  # verify_grants.sql raises if the audit table came back rewritable, so a
  # failure here stops the deploy instead of printing a 'f' nobody reads.
  grants:
    image: postgres:16-alpine
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD}
    volumes:
      - ./deploy:/deploy:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - psql -h db -U "$$POSTGRES_OWNER" -d "$$POSTGRES_DB" -f /deploy/grants.sql
        && psql -h db -U "$$POSTGRES_OWNER" -d "$$POSTGRES_DB" -f /deploy/verify_grants.sql

  web:
    build: .
    env_file: .env
    environment:
      # The app runs as the restricted role, which cannot rewrite audit rows.
      DATABASE_URL: postgres://${POSTGRES_WEB_USER}:${POSTGRES_WEB_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      grants:
        condition: service_completed_successfully
    restart: unless-stopped
    # A wedged gunicorn keeps the port open and answers nothing; without a
    # check, `restart: unless-stopped` never notices.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Migrations are NOT run here: they need the owner role, and running them
    # from an app container races when there is more than one. The `migrate`
    # service above does it once, before web starts. See DEPLOYMENT.md.

  # Interactive owner-role container: createsuperuser, shell, ad-hoc commands.
  #   docker compose run --rm admin python manage.py createsuperuser
  admin:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_OWNER}:${POSTGRES_OWNER_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["admin"]
    entrypoint: []
    command: ["python", "manage.py", "shell"]

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
