# Brute-force protection has to survive the application being bypassed, so it
# lives here as well as in django-axes: 5 sign-in attempts a minute per address,
# with a small burst so a mistyped password does not look like an attack.
limit_req_zone $binary_remote_addr zone=smti_login:1m rate=5r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/smti.crt;
    ssl_certificate_key /etc/nginx/certs/smti.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 4m;

    location /accounts/login/ {
        limit_req zone=smti_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Not logged: the container healthcheck would otherwise be most of the
    # access log, and a log nobody can skim is a log nobody reads.
    location = /healthz {
        access_log off;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
